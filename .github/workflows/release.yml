name: Release

# Tag a commit (`git tag v0.1.1 && git push --tags`) to publish, or run this by
# hand from the Actions tab to test it. A manual run builds and verifies but
# does not publish, since the version comes from the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native deps for rodio (ALSA) and eframe/winit (X11 + Wayland). No D-Bus
      # headers: the media controls use zbus, which is pure Rust.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # Shipped beside the binary, which is where the resolver looks. Latest
      # rather than pinned: yt-dlp breaks whenever YouTube changes, so a pinned
      # copy would rot between releases.
      - name: Fetch yt-dlp
        run: |
          set -euo pipefail
          curl -fsSL -o yt-dlp_linux \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x yt-dlp_linux
          ./yt-dlp_linux --version

      # yt-dlp cannot solve YouTube's challenges without a JavaScript runtime,
      # and without one playback fails. Bundled rather than left as a
      # prerequisite: QuickJS is a couple of megabytes, against asking every
      # user to install Node. The client looks for a runtime beside its own
      # executable first, so this one is picked up with no configuration.
      - name: Fetch QuickJS
        run: |
          set -euo pipefail
          curl -fsSL -o qjs \
            https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-linux-x86_64
          chmod +x qjs
          ./qjs -e 'console.log("quickjs ok")'

      - name: Assemble the bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="refrain-${version}-linux-x86_64"
          mkdir -p "dist/${name}"
          cp target/release/refrain "dist/${name}/"
          cp yt-dlp_linux "dist/${name}/"
          cp qjs "dist/${name}/"
          cp packaging/refrain.desktop packaging/refrain.metainfo.xml \
             packaging/refrain.svg "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      # A single file you can download, chmod and run — and the reason it is an
      # AppImage rather than a Flatpak: yt-dlp needs a JavaScript runtime to
      # solve YouTube's challenges, and a sandbox would need one inside it,
      # which means bundling a whole Node.
      - name: Build an AppImage
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p AppDir/usr/bin
          cp target/release/refrain AppDir/usr/bin/
          # Beside the binary is where the resolver looks for it.
          cp yt-dlp_linux AppDir/usr/bin/
          cp qjs AppDir/usr/bin/
          cp packaging/refrain.desktop AppDir/
          cp packaging/refrain.svg AppDir/
          cp packaging/refrain.svg AppDir/.DirIcon
          ln -sf usr/bin/refrain AppDir/AppRun

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # No FUSE on a runner, so unpack the tool and run it directly.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "refrain-${version}-x86_64.AppImage"
          # The tool unpacks itself into the working directory.
          rm -rf AppDir appimagetool squashfs-root

      - name: Verify the bundle runs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tar -xzf "refrain-${version}-linux-x86_64.tar.gz"
          # A GUI needs a display, but the checks do not: this proves the binary
          # starts, talks to YouTube, and finds the yt-dlp shipped beside it.
          # Output goes to a file rather than a pipe — piping into `head` closes
          # the pipe early, and `pipefail` would call that a failure.
          ./refrain-${version}-linux-x86_64/refrain --canary > canary.txt
          cat canary.txt

      # The AppImage is checked the same way, which also proves yt-dlp is found
      # through the mount point the runtime creates.
      - name: Verify the AppImage runs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./refrain-${version}-x86_64.AppImage --appimage-extract-and-run --canary \
            > canary-appimage.txt
          cat canary-appimage.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.AppImage

  macos:
    # Both architectures, built on one runner: Apple's toolchain cross-compiles,
    # and yt-dlp_macos is a universal binary, so one copy serves both.
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Fetch yt-dlp
        run: |
          set -euo pipefail
          curl -fsSL -o yt-dlp_macos \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x yt-dlp_macos
          ./yt-dlp_macos --version

      - name: Fetch QuickJS
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) asset=qjs-darwin-arm64 ;;
            x86_64-apple-darwin)  asset=qjs-darwin-x86_64 ;;
          esac
          curl -fsSL -o qjs \
            "https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/$asset"
          chmod +x qjs
          ./qjs -e 'console.log("quickjs ok")'

      # A .app rather than a bare binary, so it can be double-clicked. yt-dlp
      # goes in Contents/MacOS beside the executable, which is where the
      # resolver looks.
      - name: Assemble the bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.target }}"
          app="refrain.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/$arch/release/refrain" "$app/Contents/MacOS/"
          cp yt-dlp_macos "$app/Contents/MacOS/"
          cp qjs "$app/Contents/MacOS/"
          cp packaging/refrain.icns "$app/Contents/Resources/"
          cp README.md LICENSE "$app/Contents/"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Refrain</string>
            <key>CFBundleDisplayName</key><string>Refrain</string>
            <key>CFBundleIdentifier</key><string>io.github.4875636B30.Refrain</string>
            <key>CFBundleExecutable</key><string>refrain</string>
            <key>CFBundleIconFile</key><string>refrain.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.music</string>
          </dict>
          </plist>
          PLIST

          name="refrain-${version}-macos-${arch}"
          mkdir -p dist
          cp -R "$app" "dist/${name}.app"
          tar -C dist -czf "${name}.tar.gz" "${name}.app"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      # The checks need a JavaScript runtime for yt-dlp's challenges; the runner
      # has Node, and naming it here makes the dependency explicit.
      - name: Verify the bundle runs
        run: |
          set -euo pipefail
          node --version
          arch="${{ matrix.target }}"
          if [ "$(uname -m)" = "arm64" ] && [ "$arch" = "x86_64-apple-darwin" ]; then
            echo "skipping: running the other architecture would need Rosetta"
          elif [ "$(uname -m)" = "x86_64" ] && [ "$arch" = "aarch64-apple-darwin" ]; then
            echo "skipping: running the other architecture would need Rosetta"
          else
            ./refrain.app/Contents/MacOS/refrain --canary
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Fetch yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile yt-dlp.exe
          .\yt-dlp.exe --version

      - name: Fetch QuickJS
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-windows-x86_64.exe" -OutFile qjs.exe
          # Named `qjs.exe` deliberately: that is what the client looks for
          # beside its own executable.
          .\qjs.exe -e 'console.log("quickjs ok")'

      - name: Assemble the bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $name = "refrain-$version-windows-x86_64"
          New-Item -ItemType Directory -Path $name -Force | Out-Null
          Copy-Item target/release/refrain.exe $name
          # Beside the binary is where the resolver looks for it.
          Copy-Item yt-dlp.exe $name
          Copy-Item qjs.exe $name
          Copy-Item README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Verify the bundle runs
        shell: pwsh
        run: |
          node --version
          $version = "${{ github.ref_name }}".TrimStart("v")
          & ".\refrain-$version-windows-x86_64\refrain.exe" --canary

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            *.zip
            *.zip.sha256

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    # Only a tag publishes; a manual run stops after the builds are verified.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            *.AppImage
          generate_release_notes: true
          body: |
            Linux, macOS and Windows builds. Each one carries `yt-dlp` beside the
            executable, which is where Refrain looks for it — and a newer copy
            elsewhere on your system is used in preference, so playback keeps
            working as yt-dlp is updated.

            | platform | file |
            | --- | --- |
            | Linux (x86_64) | `.AppImage` — one file, `chmod +x` and run — or the tarball |
            | macOS (Apple silicon / Intel) | tarball containing `refrain.app` |
            | Windows (x86_64) | `.zip` with `refrain.exe` |

            **None of these are signed.** macOS will refuse a downloaded `.app`
            until you allow it — right-click, *Open*, then confirm — and Windows
            SmartScreen will ask before running an unknown publisher's `.exe`.

            Playback needs no JavaScript runtime installed: each of these
            carries **QuickJS** beside the executable, which is what yt-dlp uses
            to solve YouTube's challenges. `ffmpeg` is still needed, but only for
            the fallback path that transcodes a stream the fast path could not
            use.
