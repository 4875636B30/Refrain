name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    # All three platforms, because "it works on my machine" is exactly the
    # failure this is here to catch: the code has platform-specific pieces
    # (browser profile discovery, the Windows window handle for media controls,
    # executable lookup with `.exe`) that cannot be exercised on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Native deps for rodio (ALSA) and eframe/winit (X11 + Wayland). macOS and
      # Windows need nothing: CoreAudio and WASAPI come with the OS, and winit
      # links against the system frameworks.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            appstream \
            desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # The output is captured to a file as well as the log: job logs need
      # admin rights to fetch, artifacts do not.
      - name: Clippy
        shell: bash
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "clippy-${{ runner.os }}.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload clippy output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ runner.os }}
          path: clippy-*.log

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release

      # The launcher entry and AppStream metadata are easy to break by hand and
      # nothing else would notice. Linux-only files, so Linux-only checks.
      - name: Validate packaging metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/refrain.desktop
          appstreamcli validate --no-net packaging/refrain.metainfo.xml
