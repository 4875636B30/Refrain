name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native deps for rodio (ALSA) and eframe/winit (X11 + Wayland).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            appstream \
            desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      # The launcher entry and AppStream metadata are easy to break by hand and
      # nothing else would notice.
      - name: Validate packaging metadata
        run: |
          desktop-file-validate packaging/refrain.desktop
          appstreamcli validate --no-net packaging/refrain.metainfo.xml

      - name: Build
        run: cargo build --release
