[package]
name = "refrain"
version = "0.1.18"
edition = "2024"
description = "A fast, low-memory desktop client for YouTube Music"
license = "MIT"
repository = "https://github.com/4875636B30/Refrain"
readme = "README.md"
keywords = ["music", "youtube", "egui", "audio", "player"]
categories = ["multimedia::audio", "gui"]

# Shipping profile. `strip` matters more than it looks: an unstripped release
# binary was 41 MB, and its text and rodata are mapped into every running
# process, so it costs resident memory as well as download size.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
# reqwest hands back `Bytes`; naming it avoids copying every image again.
bytes = "1"
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# For the window handle souvlaki needs on Windows (SMTC). Same version eframe
# uses, so it is already in the graph.
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "query", "charset", "gzip", "http2", "blocking"] }
rodio = "0.22.2"
# Desktop media controls. The zbus backend is pure Rust, so packaging does not
# need libdbus headers.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sha1 = "0.11.0"
# Verifying a downloaded update against the checksum the release publishes.
sha2 = "0.10.9"
thiserror = "2.0.21"
flate2 = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
toml = "1.1.8"
# Unpacking a downloaded release tarball.
tar = "0.4.44"

