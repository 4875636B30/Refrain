[package]
name = "refrain"
version = "0.1.0"
edition = "2024"
description = "A fast, low-memory desktop client for YouTube Music"
license = "MIT"
readme = "README.md"
keywords = ["music", "youtube", "egui", "audio", "player"]
categories = ["multimedia::audio", "gui"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "query", "charset", "gzip", "http2", "blocking"] }
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
toml = "1.1.8"
